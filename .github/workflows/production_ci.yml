name: Production - CI Build

run-name: Build Pokémon Studio ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      force_build_node_module:
        description: 'Force build node_modules'
        type: boolean
        default: true
        required: true

      release_tag:
        description: 'Draft release tag, for example v2.10.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Studio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup_environment
        with:
          force_build_node_module: ${{ inputs.force_build_node_module || false }}

      - name: Publish Studio
        uses: ./.github/actions/publish_studio

  update-release-notes:
    name: Update draft release notes
    needs: build

    permissions:
      contents: write
      pull-requests: read

    uses: ./.github/workflows/update-release-notes.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      allow_missing_draft: false
