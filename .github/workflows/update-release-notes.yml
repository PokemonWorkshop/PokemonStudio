name: Update Release Notes

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Explicit release tag; empty means derive it from package.json'
        required: false
        type: string
        default: ''

      allow_missing_draft:
        description: 'Succeed when no matching draft release exists'
        required: false
        type: boolean
        default: false

jobs:
  update:
    name: Update draft release notes
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_MISSING_DRAFT: ${{ inputs.allow_missing_draft }}
        run: node scripts/release/generate-release-notes.mjs
