name: Development CI

on:
  push:
    branches: [develop]

  workflow_dispatch:
    inputs:
      force_build_node_module:
        description: 'Force build node_modules'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Studio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup_environment
        with:
          force_build_node_module: ${{ inputs.force_build_node_module || false }}

      - name: Package Studio
        uses: ./.github/actions/package_studio

  update-release-notes:
    name: Update draft release notes
    needs: build
    if: ${{ github.ref == 'refs/heads/develop' }}

    concurrency:
      group: update-release-notes-develop
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: read

    uses: ./.github/workflows/update-release-notes.yml
    with:
      allow_missing_draft: true
