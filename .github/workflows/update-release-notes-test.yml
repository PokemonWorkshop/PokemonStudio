name: Update Release Notes test

on:
  push:
    branches: ['cicd/generate-release-notes']

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Test release tag'
        required: true
        type: string
        default: 'discord-changelog-test'

      allow_missing_draft:
        description: 'Succeed when no matching draft release exists'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      release_tag:
        description: 'Test release tag'
        required: true
        type: string
        default: 'discord-changelog-test'

      allow_missing_draft:
        description: 'Succeed when no matching draft release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-release-notes-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Update draft release notes test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && 'v2.11.0' || inputs.release_tag }}
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_TEST_WEBHOOK_URL }}
          ALLOW_MISSING_DRAFT: ${{ github.event_name == 'push' && 'false' || inputs.allow_missing_draft }}
        run: node scripts/release/generate-release-notes.mjs
